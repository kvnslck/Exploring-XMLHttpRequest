<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHR Demo</title>
</head>
<body>

    <h2>XMLHttpRequest Demo</h2>

    <button id="loadData">Load Post Data</button>

    <div id="output" style="margin-top: 20px;"></div>

    <script>
        document.getElementById("loadData").onclick = function() {

            let xhr = new XMLHttpRequest();
            let output = document.getElementById("output");

            output.innerHTML = "Loading...";

            xhr.onreadystatechange = function() {

                if (xhr.readyState == 4) {

                    if (xhr.status == 200) {

                        let post = JSON.parse(xhr.responseText);

                        output.innerHTML =
                            "<b>Post Title:</b> " + post.title +
                            "<br><br>" +
                            "<b>Content:</b> " + post.body;

                    } else {

                        output.innerHTML =
                            "<p style='color:red;'>Something went wrong. Error: "
                            + xhr.status + "</p>";
                    }
                }
            };

            xhr.open(
                "GET",
                "https://jsonplaceholder.typicode.com/posts/1",
                true
            );

            xhr.send();
        };
    </script>

</body>
</html>
